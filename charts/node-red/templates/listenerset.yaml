{{- include "node-red.gateway.validate" . }}
{{- if .Values.listenerSet.listeners }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "node-red.gateway.fullname" . }}
  {{- with (include "node-red.gateway.labels" . | trim) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.listenerSet.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    {{- if .Values.listenerSet.parentRef }}
    {{- toYaml .Values.listenerSet.parentRef | nindent 4 }}
    {{- else }}
    name: {{ .Values.listenerSet.gateway.name | quote }}
    namespace: {{ .Values.listenerSet.gateway.namespace | quote }}
    kind: Gateway
    group: gateway.networking.k8s.io
    {{- end }}
  listeners:
    {{- toYaml .Values.listenerSet.listeners | nindent 4 }}
{{- end }}
