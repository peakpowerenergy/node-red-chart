{{- if and .Values.listenerSet .Values.listenerSet.enabled .Values.listenerSet.httpRedirect }}
{{- $redirect := omit .Values.listenerSet.httpRedirect "enabled" }}
{{- if $redirect }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "node-red.fullname" . }}-http
  labels:
    {{- include "node-red.labels" . | nindent 4 }}
  {{- with $redirect.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if $redirect.parentRefs }}
    {{- toYaml $redirect.parentRefs | nindent 4 }}
    {{- else }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.listenerSet.gateway.name | quote }}
      namespace: {{ $.Values.listenerSet.gateway.namespace | quote }}
      sectionName: {{ $redirect.sectionName | quote }}
    {{- end }}
  hostnames:
    {{- include "node-red.listenerHostnames" . | nindent 4 }}
  rules:
    {{- if $redirect.rules }}
    {{- toYaml $redirect.rules | nindent 4 }}
    {{- else }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ $redirect.scheme | default "https" }}
            statusCode: {{ $redirect.statusCode }}
    {{- end }}
{{- end }}
{{- end }}
